<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novel Map AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#090d18;color:#eef2ff}.wrap{max-width:900px;margin:auto;padding:32px 18px}.hero{text-align:center;padding:35px 0}h1{font-size:38px;margin:0}.sub{color:#9aa5c3;margin:10px}.card{background:#12182a;border:1px solid #27304b;border-radius:20px;padding:20px;margin:16px 0}input{width:100%;padding:16px;border-radius:12px;border:1px solid #39435e;background:#0b1020;color:white;font-size:16px}button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:12px;background:#6d5dfc;color:white;font-weight:800;font-size:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center;background:#0b1020;padding:15px;border-radius:12px}.num{font-size:25px;font-weight:800}.tabs{display:flex;gap:8px}.tabs button{width:auto;flex:1}.item{padding:13px 4px;border-bottom:1px solid #252d44}.muted{color:#99a4bf;font-size:13px}.hide{display:none}#msg{padding:12px 0;color:#b8c2df}@media(max-width:600px){h1{font-size:30px}.stats{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="hero"><h1>📚 Novel Map AI</h1><div class="sub">Paste a novel URL. Find recurring characters and locations across its chapters.</div></div><div class="card"><input id="url" placeholder="https://example.com/novel/..."><button onclick="go()">Analyze Full Novel</button><div id="msg"></div></div><div id="out" class="hide"><div class="stats"><div class="stat"><div class="num" id="ch">0</div><div>Chapters scanned</div></div><div class="stat"><div class="num" id="cc">0</div><div>Characters</div></div><div class="stat"><div class="num" id="lc">0</div><div>Locations</div></div></div><div class="card"><div class="tabs"><button onclick="show('chars')">Characters</button><button onclick="show('locs')">Locations</button><button onclick="copyAll()">Copy Results</button></div><div id="chars"></div><div id="locs" class="hide"></div></div></div></div><script>let data;async function go(){let u=url.value.trim();msg.textContent='Scanning chapters… large novels can take a while.';out.classList.add('hide');try{let r=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:u,maxChapters:120})});data=await r.json();if(!r.ok)throw Error(data.error);ch.textContent=data.chaptersProcessed;cc.textContent=data.characters.length;lc.textContent=data.locations.length;chars.innerHTML=data.characters.map((x,i)=>`<div class=item><b>${i+1}. ${x.name}</b><div class=muted>Mentions: ${x.count} · First detected chapter: ${x.firstChapter}</div></div>`).join('')||'No reliable characters detected.';locs.innerHTML=data.locations.map((x,i)=>`<div class=item><b>${i+1}. ${x.name}</b><div class=muted>Mentions: ${x.count} · First detected chapter: ${x.firstChapter}</div></div>`).join('')||'No reliable locations detected.';msg.textContent=data.note;out.classList.remove('hide')}catch(e){msg.textContent='❌ '+e.message}}function show(x){chars.classList.toggle('hide',x!=='chars');locs.classList.toggle('hide',x!=='locs')}function copyAll(){if(!data)return;let t='CHARACTERS\n'+data.characters.map((x,i)=>`${i+1}. ${x.name} — mentions ${x.count}, first chapter ${x.firstChapter}`).join('\n')+'\n\nLOCATIONS\n'+data.locations.map((x,i)=>`${i+1}. ${x.name} — mentions ${x.count}, first chapter ${x.firstChapter}`).join('\n');navigator.clipboard.writeText(t);msg.textContent='✅ Results copied.'}</script></body></html>
